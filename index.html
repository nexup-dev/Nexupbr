<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nexup — Sua presença digital, em evolução</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07050c;--bg2:#0f0b1a;--ink:#f3effa;--mut:#9c93b3;--p1:#4c1d95;--p2:#7c3aed;--p3:#a855f7;--p4:#c4a0ff;--line:rgba(168,85,247,.18);
--d:'Syne','Helvetica Neue',Arial,sans-serif;--b:'Manrope','Helvetica Neue',Arial,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-behavior:smooth;scroll-padding-top:90px;height:auto}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.65 var(--b);overflow-x:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--p4);outline-offset:3px}
#glow{position:fixed;width:520px;height:520px;border-radius:50%;pointer-events:none;z-index:0;left:0;top:0;background:radial-gradient(circle,rgba(124,58,237,.28),transparent 65%);transform:translate(-50%,-50%);transition:opacity .4s}
#bar{position:fixed;top:0;left:0;height:2px;width:0;background:linear-gradient(90deg,var(--p2),var(--p4));z-index:60}
nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:18px max(5vw,20px);backdrop-filter:blur(14px);background:rgba(7,5,12,.55);border-bottom:1px solid transparent;transition:border-color .3s}
nav.s{border-color:var(--line)}
.logo{display:flex;align-items:center;gap:10px;font:800 22px var(--d);letter-spacing:.02em}
.logo svg{width:30px;height:30px}
.links{display:flex;gap:30px;font-size:15px;color:var(--mut)}
.links a{position:relative;transition:color .25s}
.links a::after{content:"";position:absolute;left:0;bottom:-4px;height:1px;width:0;background:var(--p3);transition:width .3s}
.links a:hover{color:var(--ink)}.links a:hover::after{width:100%}
.btn{display:inline-block;padding:13px 26px;border-radius:99px;background:linear-gradient(135deg,var(--p2),var(--p3));color:#fff;font-weight:600;font-size:15px;position:relative;overflow:hidden;transition:transform .25s,box-shadow .25s;box-shadow:0 8px 30px -8px rgba(124,58,237,.7)}
.btn::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 40px -8px rgba(168,85,247,.8)}.btn:hover::before{transform:translateX(120%)}
.ghost{background:transparent;border:1px solid var(--line);box-shadow:none;color:var(--ink)}
.ghost:hover{border-color:var(--p3);box-shadow:none}
section{position:relative;z-index:1;padding:130px max(5vw,20px)}
.w{max-width:1120px;margin:0 auto}
h1,h2,h3{font-family:var(--d);margin:0;line-height:1.04;letter-spacing:-.02em}
h2{font-size:clamp(34px,5vw,60px);font-weight:700;max-width:16ch}
p.lead{color:var(--mut);max-width:52ch;font-weight:300;font-size:19px}
/* hero */
.hero{min-height:100vh;display:grid;place-items:center;text-align:center;padding-top:140px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:70px 70px;mask-image:radial-gradient(circle at 50% 45%,#000,transparent 65%);opacity:.5;animation:grid 14s linear infinite}
@keyframes grid{to{background-position:0 70px,70px 0}}
.mark{width:clamp(150px,22vw,230px);margin:0 auto 34px;filter:drop-shadow(0 0 40px rgba(168,85,247,.55));animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-14px)}}
.mark path.n{stroke-dasharray:420;stroke-dashoffset:420;animation:draw 2s .3s cubic-bezier(.6,0,.2,1) forwards}
.mark .hd{opacity:0;transform-origin:186px 20px;animation:pop .6s 2.1s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(.3) translate(-10px,10px)}to{opacity:1;transform:none}}
.hero h1{font-size:clamp(42px,8vw,104px);font-weight:800;max-width:14ch;margin:0 auto}
.hero h1 span{display:inline-block;opacity:0;transform:translateY(60%) rotate(4deg);animation:up .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes up{to{opacity:1;transform:none}}
.hero .lead{margin:26px auto 38px;opacity:0;animation:up .9s 1.3s forwards}
.cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;opacity:0;animation:up .9s 1.5s forwards}
.scroll{position:absolute;bottom:28px;left:50%;width:1px;height:50px;background:linear-gradient(var(--p3),transparent);animation:sc 2s infinite}
@keyframes sc{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
.hero .w{position:relative;z-index:1;will-change:transform,opacity}
.hero::after{content:"";position:absolute;width:min(90vw,760px);aspect-ratio:1;left:50%;top:46%;border-radius:50%;background:conic-gradient(from 0deg,transparent,rgba(124,58,237,.3),transparent 40%);filter:blur(30px);animation:spin 12s linear infinite;transform:translate(-50%,-50%)}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wd{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em}
.wd i{display:inline-block;font-style:normal;transform:translateY(110%) rotate(6deg);transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.in .wd i{transform:none}
#rail{position:fixed;right:max(2vw,14px);top:50%;transform:translateY(-50%);width:26px;height:260px;z-index:55}
#rail a{cursor:pointer}
#rail .dot{fill:var(--bg);stroke:var(--p3);stroke-width:1.5;transition:.4s}
#rail .dot.on{fill:var(--p3);r:6}
#up{position:fixed;right:max(2vw,14px);bottom:max(22px,env(safe-area-inset-bottom,0px));width:54px;height:54px;z-index:55;border-radius:50%;background:rgba(7,5,12,.7);backdrop-filter:blur(10px);opacity:0;transform:translateY(20px) scale(.8);transition:.5s cubic-bezier(.2,.8,.2,1);pointer-events:none}
#up.on{opacity:1;transform:none;pointer-events:auto}
#up:hover{transform:translateY(-4px)}
#up svg{width:100%;height:100%}
.trend{margin-top:70px;width:100%;overflow:visible}
.trend .tk{stroke:var(--line);stroke-width:2;fill:none;stroke-dasharray:4 8}
.trend .pr{stroke:url(#g);stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 10px rgba(168,85,247,.8))}
.trend .hd{fill:#c084fc;filter:drop-shadow(0 0 12px #a855f7)}

.proj{display:block}.proj .tp{color:var(--p4);font-size:14px;margin-bottom:14px;display:block;position:relative}
.proj .go{display:inline-block;margin-top:22px;font-weight:600;font-size:15px;position:relative;color:var(--p4)}
.proj .go::after{content:"";display:block;height:1px;background:var(--p3);transform:scaleX(.3);transform-origin:left;transition:transform .4s}
.proj:hover .go::after{transform:scaleX(1)}
/* marquee */
.mq{position:relative;z-index:1;border-block:1px solid var(--line);overflow:hidden;padding:22px 0;background:var(--bg2)}
.mq div{display:flex;gap:60px;width:max-content;animation:mq 28s linear infinite;font:700 26px var(--d);color:transparent;-webkit-text-stroke:1px var(--p3)}
@keyframes mq{to{transform:translateX(-50%)}}
/* reveal */
.r{opacity:0;transform:translateY(40px);transition:opacity .9s,transform .9s cubic-bezier(.2,.8,.2,1)}
.r.in{opacity:1;transform:none}
/* steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:70px;position:relative}
.steps::before{content:"";position:absolute;top:22px;left:0;height:1px;width:var(--w,0%);background:linear-gradient(90deg,var(--p2),var(--p4));transition:width 1.6s cubic-bezier(.3,.7,.2,1)}
.steps::after{content:"";position:absolute;top:22px;left:0;right:0;height:1px;background:var(--line);z-index:-1}
.step{padding-right:30px}
.step i{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--bg);border:1px solid var(--p3);font:700 15px var(--d);font-style:normal;margin-bottom:22px}
.step h3{font-size:24px;margin-bottom:10px}.step p{color:var(--mut);margin:0;font-weight:300}
/* features */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:70px}
.card{padding:34px 30px;border-radius:22px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(124,58,237,.1),rgba(15,11,26,.6));position:relative;overflow:hidden;transition:transform .4s cubic-bezier(.2,.8,.2,1),border-color .3s;transform-style:preserve-3d}
.card::before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;left:var(--mx,50%);top:var(--my,0);transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(168,85,247,.3),transparent 65%);opacity:0;transition:opacity .3s}
.card:hover{border-color:var(--p3)}.card:hover::before{opacity:1}
.card svg{width:38px;height:38px;stroke:var(--p4);fill:none;stroke-width:1.5;margin-bottom:26px;position:relative}
.card h3{font-size:22px;margin-bottom:10px;position:relative}.card p{margin:0;color:var(--mut);font-weight:300;font-size:16px;position:relative}
/* showcase */
.show{background:var(--bg2);border-block:1px solid var(--line)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:46px 0 30px}
.tab{font:500 15px var(--b);color:var(--mut);background:none;border:1px solid var(--line);padding:10px 22px;border-radius:99px;cursor:pointer;transition:.3s}
.tab:hover{color:var(--ink)}.tab[aria-selected=true]{background:var(--p2);color:#fff;border-color:var(--p2)}
.frame{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--bg);box-shadow:0 40px 100px -30px rgba(124,58,237,.5)}
.top{display:flex;gap:7px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.top b{width:10px;height:10px;border-radius:50%;background:var(--p1)}
.top em{margin-left:14px;font:400 13px var(--b);color:var(--mut);font-style:normal;background:rgba(255,255,255,.04);padding:4px 16px;border-radius:99px}
.view{display:none;padding:44px;min-height:340px;gap:22px;animation:vin .6s cubic-bezier(.2,.8,.2,1)}
.view.on{display:grid}
@keyframes vin{from{opacity:0;transform:translateY(24px) scale(.98)}}
.sk{border-radius:10px;background:linear-gradient(100deg,rgba(124,58,237,.14) 30%,rgba(196,160,255,.3) 50%,rgba(124,58,237,.14) 70%);background-size:300% 100%;animation:sh 2.4s linear infinite}
@keyframes sh{to{background-position:-300% 0}}
.v1{grid-template-columns:1.2fr 1fr;align-items:center}.v1 .col{display:grid;gap:14px}
.v2{grid-template-columns:1fr 1fr 1fr}.v3{grid-template-columns:1fr 1fr}.v4{grid-template-columns:1fr 1.4fr}
.blob{aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--p4),var(--p2) 45%,var(--p1));animation:float 5s ease-in-out infinite;max-width:240px;justify-self:center;width:100%}
/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;margin-top:70px;text-align:left}
.stats div{border-left:1px solid var(--p3);padding-left:24px}
.stats b{display:block;font:800 clamp(44px,6vw,76px) var(--d);line-height:1;background:linear-gradient(180deg,#fff,var(--p4));-webkit-background-clip:text;background-clip:text;color:transparent}
.stats span{color:var(--mut);font-size:15px}
/* final */
.end{text-align:center;overflow:hidden}
.end::before{content:"";position:absolute;left:50%;top:50%;width:900px;height:900px;max-width:140vw;border-radius:50%;transform:translate(-50%,-50%);border:1px solid var(--line);box-shadow:0 0 0 120px rgba(124,58,237,.04),0 0 0 240px rgba(124,58,237,.03);animation:pulse 6s ease-in-out infinite}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.07)}}
.end h2{margin:0 auto 24px;max-width:15ch;position:relative}.end .lead{margin:0 auto 38px;position:relative}.end .cta{opacity:1;animation:none;position:relative}
footer{position:relative;z-index:1;display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;padding:34px max(5vw,20px);border-top:1px solid var(--line);color:var(--mut);font-size:14px}
@media(max-width:820px){.links{display:none}#rail{display:none}.steps,.grid,.stats,.v2,.v3,.v4,.v1{grid-template-columns:1fr}.steps::before,.steps::after{display:none}.step{margin-bottom:34px}section{padding:90px 20px}.view{padding:24px}#glow{display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.r,.hero h1 span,.hero .lead,.cta,.mark .hd{opacity:1!important;transform:none!important}.mark path.n{stroke-dashoffset:0}}
</style>
</head>
<body>
<div id="bar"></div><canvas id="fx"></canvas><div id="glow"></div>
<svg id="rail" viewBox="0 0 26 260" aria-label="Progresso da página">
  <line x1="13" y1="10" x2="13" y2="250" stroke="rgba(168,85,247,.2)" stroke-width="2"/>
  <line id="rp" x1="13" y1="250" x2="13" y2="250" stroke="#a855f7" stroke-width="2" stroke-linecap="round"/>
  <g id="rd"></g>
  <polygon id="ra" points="-7,6 0,-7 7,6" fill="#c084fc" transform="translate(13,250)"/>
</svg>
<a id="up" href="#topo" aria-label="Voltar ao topo"><svg viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="20" stroke="rgba(168,85,247,.25)" stroke-width="3"/><circle id="rg" cx="24" cy="24" r="20" stroke="#c084fc" stroke-width="3" stroke-linecap="round" stroke-dasharray="125.7" stroke-dashoffset="125.7" transform="rotate(-90 24 24)"/><path d="M24 32V16M17 22l7-7 7 7" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="g" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#2e1065"/><stop offset=".6" stop-color="#6d28d9"/><stop offset="1" stop-color="#c084fc"/></linearGradient></defs></svg>

<div id="app"></div>
<script>
let D;
const MARK=`<svg class="mark" viewBox="0 0 200 150" fill="none" aria-hidden="true"><path class="n" d="M10 140 L52 56 Q62 38 74 56 L112 124 Q122 140 134 124 L176 40" stroke="url(#g)" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/><path class="hd" d="M146 12 L196 4 L186 56Z" fill="#c084fc"/></svg>`;
const LOGO=`<svg viewBox="0 0 200 150" fill="none"><path d="M10 140 L52 56 Q62 38 74 56 L112 124 Q122 140 134 124 L180 36" stroke="url(#g)" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/><path d="M150 14 L196 8 L184 54Z" fill="#c084fc"/></svg>`;
const VIEWS=`<div class="view v1 on"><div class="col"><div class="sk" style="height:18px;width:40%"></div><div class="sk" style="height:54px"></div><div class="sk" style="height:54px;width:80%"></div><div class="sk" style="height:14px;width:65%"></div><div class="sk" style="height:42px;width:36%;border-radius:99px"></div></div><div class="blob"></div></div>
    <div class="view v2"><div class="sk" style="height:200px"></div><div class="sk" style="height:200px"></div><div class="sk" style="height:200px"></div></div>
    <div class="view v3"><div class="blob" style="border-radius:24px;aspect-ratio:4/3;max-width:none"></div><div style="display:grid;gap:14px;align-content:center"><div class="sk" style="height:34px;width:70%"></div><div class="sk" style="height:14px"></div><div class="sk" style="height:14px"></div><div class="sk" style="height:14px;width:60%"></div></div></div>
    <div class="view v4"><div style="display:grid;gap:14px;align-content:center"><div class="sk" style="height:34px;width:80%"></div><div class="sk" style="height:14px"></div><div class="sk" style="height:14px;width:55%"></div></div><div style="display:grid;gap:12px"><div class="sk" style="height:46px"></div><div class="sk" style="height:46px"></div><div class="sk" style="height:96px"></div><div class="sk" style="height:46px;width:40%;border-radius:99px"></div></div></div>`;
function render(d){
  document.title=d.meta.titulo;
  const links=d.nav.links.map(l=>`<a href="${l.href}">${l.texto}</a>`).join('');
  const passos=d.como.passos.map((p,i)=>`<div class="step"><i>${i+1}</i><h3>${p.titulo}</h3><p>${p.texto}</p></div>`).join('');
  const cards=d.recursos.cards.map(c=>`<article class="card r"><svg viewBox="0 0 40 40">${c.icone}</svg><h3>${c.titulo}</h3><p>${c.texto}</p></article>`).join('');
  const abas=d.paginas.abas.map((a,i)=>`<button class="tab" role="tab" aria-selected="${i==0}" data-v="${i}">${a.rotulo}</button>`).join('');
  const proj=d.projetos.itens.map(p=>`<a class="card proj r" href="${p.link}" target="_blank" rel="noopener"><span class="tp">${p.tipo}</span><h3>${p.nome}</h3><p>${p.descricao}</p><span class="go">${d.projetos.botao}</span></a>`).join('');
  const nums=d.numeros.itens.map(n=>`<div><b data-n="${n.n}" data-s="${n.sufixo}">0</b><span>${n.texto}</span></div>`).join('');
  document.getElementById('app').innerHTML=`
<nav id="nav"><a class="logo" href="#topo" aria-label="${d.marca.nome}">${LOGO}${d.marca.nome}</a><div class="links">${links}</div><a class="btn" href="${d.nav.cta.href}">${d.nav.cta.texto}</a></nav>
<header class="hero" id="topo"><div class="w">${MARK}<h1 id="t"></h1><p class="lead">${d.hero.texto}</p><div class="cta"><a class="btn" href="${d.hero.botao1.href}">${d.hero.botao1.texto}</a><a class="btn ghost" href="${d.hero.botao2.href}">${d.hero.botao2.texto}</a></div></div><div class="scroll"></div></header>
<div class="mq" aria-hidden="true"><div id="mq"></div></div>
<section id="como"><div class="w"><h2 class="r">${d.como.titulo}</h2><div class="steps r" id="steps">${passos}</div></div></section>
<section id="recursos"><div class="w"><h2 class="r">${d.recursos.titulo}</h2><div class="grid">${cards}</div></div></section>
<section class="show" id="paginas"><div class="w"><h2 class="r">${d.paginas.titulo}</h2><p class="lead r" style="margin-top:20px">${d.paginas.texto}</p><div class="tabs" role="tablist">${abas}</div>
<div class="frame r"><div class="top"><b></b><b></b><b></b><em id="url">${d.paginas.abas[0].url}</em></div>${VIEWS}
</div></div></section>
<section id="projetos"><div class="w"><h2 class="r">${d.projetos.titulo}</h2><p class="lead r" style="margin-top:20px">${d.projetos.texto}</p><div class="grid">${proj}</div></div></section>
<section id="numeros"><div class="w"><h2 class="r">${d.numeros.titulo}</h2>
<svg class="trend" id="trend" viewBox="0 0 1000 230" aria-hidden="true"><path class="tk" id="tk" d="M0 210 L130 150 L230 175 L370 100 L480 128 L630 55 L750 85 L920 18"/><path class="pr" id="pr" d="M0 210 L130 150 L230 175 L370 100 L480 128 L630 55 L750 85 L920 18"/><polygon class="hd" id="th" points="-14,-10 16,0 -14,10"/></svg>
<div class="stats r">${nums}</div></div></section>
<section class="end" id="contato"><div class="w"><h2 class="r">${d.final.titulo}</h2><p class="lead r">${d.final.texto}</p><div class="cta r"><a class="btn" href="mailto:${d.marca.email}">${d.final.botao}</a></div></div></section>
<footer><span>${d.rodape.esquerda}</span><span>${d.rodape.direita}</span></footer>`;
}

function boot(){
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
// headline por palavra
$('#t').innerHTML=D.hero.titulo.split(' ').map((w,i)=>`<span style="animation-delay:${.9+i*.12}s">${w}</span>`).join(' ');
// marquee
$('#mq').innerHTML=D.faixa.map(t=>`<span>${t}</span>`).join('').repeat(4);
// glow + barra + nav
const g=$('#glow');addEventListener('pointermove',e=>{g.style.left=e.clientX+'px';g.style.top=e.clientY+'px'});
addEventListener('scroll',()=>{const h=document.documentElement;$('#bar').style.width=(scrollY/(h.scrollHeight-innerHeight)*100)+'%';$('#nav').classList.toggle('s',scrollY>20)},{passive:true});
// reveal
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');if(e.target.id==='steps')e.target.style.setProperty('--w','100%');io.unobserve(e.target)}}),{threshold:.2});
$$('.r').forEach((el,i)=>{el.style.transitionDelay=(i%3)*.1+'s';io.observe(el)});
// brilho nos cards
$$('.card').forEach(c=>c.addEventListener('pointermove',e=>{const r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;c.style.setProperty('--mx',x+'px');c.style.setProperty('--my',y+'px');c.style.transform=`perspective(800px) rotateX(${(.5-y/r.height)*6}deg) rotateY(${(x/r.width-.5)*6}deg) translateY(-4px)`}));
$$('.card').forEach(c=>c.addEventListener('pointerleave',()=>c.style.transform=''));
// abas
const urls=D.paginas.abas.map(a=>a.url);
$$('.tab').forEach(t=>t.addEventListener('click',()=>{$$('.tab').forEach(x=>x.setAttribute('aria-selected',x===t));$$('.view').forEach((v,i)=>v.classList.toggle('on',i==t.dataset.v));$('#url').textContent=urls[t.dataset.v]}));
const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
// títulos palavra por palavra
$$('h2').forEach(h=>{h.innerHTML=h.textContent.split(' ').map((w,i)=>`<span class="wd"><i style="transition-delay:${i*.08}s">${w}</i></span>`).join(' ')});
// trilho SVG de scroll
const secs=['topo','como','recursos','paginas','projetos','numeros','contato'],rd=$('#rd');
rd.innerHTML=secs.map((s,i)=>`<a href="#${s}"><circle class="dot" cx="13" cy="${250-i*40}" r="4.5"/></a>`).join('');
const dots=$$('#rail .dot'),CL=125.7;
const trend=$('#pr'),TL=trend.getTotalLength(),th=$('#th');
trend.style.strokeDasharray=TL;trend.style.strokeDashoffset=TL;
function onScroll(){
  const h=document.documentElement,p=Math.min(scrollY/Math.max(h.scrollHeight-innerHeight,1),1);
  const y=250-240*p;$('#rp').setAttribute('y2',y);$('#ra').setAttribute('transform',`translate(13,${y})`);
  $('#rg').style.strokeDashoffset=CL*(1-p);$('#up').classList.toggle('on',scrollY>500);
  let a=0;secs.forEach((s,i)=>{if($('#'+s).getBoundingClientRect().top<innerHeight*.5)a=i});
  dots.forEach((d,i)=>d.classList.toggle('on',i<=a));
  const hw=$('.hero .w');if(scrollY<innerHeight){hw.style.transform=`translateY(${scrollY*.25}px)`;hw.style.opacity=1-scrollY/(innerHeight*.8)}
  const r=trend.closest('svg').getBoundingClientRect(),t=Math.min(Math.max((innerHeight*.85-r.top)/(innerHeight*.55),0),1);
  trend.style.strokeDashoffset=TL*(1-t);
  const L=t*TL,pt=trend.getPointAtLength(L),q=trend.getPointAtLength(Math.min(L+2,TL)),ang=Math.atan2(q.y-pt.y,q.x-pt.x)*180/Math.PI;
  th.setAttribute('transform',`translate(${pt.x},${pt.y}) rotate(${ang})`);th.style.opacity=t>0?1:0;
}
addEventListener('scroll',onScroll,{passive:true});addEventListener('resize',onScroll);onScroll();
// botões magnéticos
$$('.btn').forEach(b=>{b.addEventListener('pointermove',e=>{const r=b.getBoundingClientRect();b.style.transform=`translate(${(e.clientX-r.left-r.width/2)*.2}px,${(e.clientY-r.top-r.height/2)*.35}px)`});b.addEventListener('pointerleave',()=>b.style.transform='')});
// partículas que sobem
if(!rm){const c=$('#fx'),x=c.getContext('2d');let W,H,P=[];const rs=()=>{W=c.width=innerWidth;H=c.height=innerHeight;P=Array.from({length:Math.min(70,W/18|0)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+.4,v:Math.random()*.5+.15,a:Math.random()*6}))};rs();addEventListener('resize',rs);
(function f(){x.clearRect(0,0,W,H);P.forEach(p=>{p.y-=p.v;p.x+=Math.sin(p.a+=.01)*.3;if(p.y<-10){p.y=H+10;p.x=Math.random()*W}x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fillStyle=`rgba(196,160,255,${.25+Math.sin(p.a*3)*.2})`;x.fill()});requestAnimationFrame(f)})()}
// contadores
const co=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const b=e.target,n=+b.dataset.n,s=b.dataset.s;let t0;const f=t=>{t0??=t;const p=Math.min((t-t0)/1600,1);b.textContent=Math.round(n*(1-Math.pow(1-p,3)))+s;if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f);co.unobserve(b)}),{threshold:.6});
$$('[data-n]').forEach(b=>co.observe(b));

}
fetch('data.json').then(r=>r.json()).then(d=>{D=d;render(d);boot()}).catch(()=>{document.getElementById('app').innerHTML='<p style="padding:120px 24px;text-align:center">Não foi possível carregar o data.json. Abra o index.html por um servidor local (por exemplo, a extensão Live Server) e deixe os dois arquivos na mesma pasta.</p>'});
</script>
</body>
</html>
